name: release

on:
  push:
    tags:
      - "v*"

jobs:
  manifest:
    name: verifica manifest.json
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: recalcula sha256 (tools/make_manifest.py)
        run: python3 tools/make_manifest.py

      # gate de versao: os tres numeros que decidem se o parque recebe a
      # release sao editados A MAO em arquivos diferentes (tag, manifest,
      # VERSION dentro do rbz). Divergiu -> falha silenciosa em producao:
      # tag != biblioteca_version faz os dois instaladores curto-circuitarem
      # em "ja esta atualizada" (biblioteca_version e o unico criterio de
      # no-op) e ninguem baixa nada; manifest.plugins[0].version != VERSION do
      # rbz deixa banner de update permanente que reinstalar nunca limpa.
      - name: gate de versao (tag == biblioteca_version, manifest == rbz, jsx solto == jsx do zip)
        run: |
          set -euo pipefail
          # v9.2.0 -> BASE=9.2.0 SUFFIX=""; v9.2.0-rc1 -> BASE=9.2.0 SUFFIX=rc1
          BASE="${GITHUB_REF_NAME#v}"
          SUFFIX=""
          case "$BASE" in
            *-*) SUFFIX="${BASE#*-}"; BASE="${BASE%%-*}" ;;
          esac
          case "$SUFFIX" in
            "")
              : ;;
            rc[0-9] | rc[0-9][0-9])
              echo "::warning::tag $GITHUB_REF_NAME tem sufixo -$SUFFIX: sai como prerelease e NAO vira /releases/latest/download — nenhum aluno recebe. so serve pra teste; release de verdade e vX.Y.Z sem sufixo." ;;
            *)
              echo "::error::tag $GITHUB_REF_NAME tem hifen: prerelease: contains(github.ref_name, '-') marca esta release como prerelease, e o parque so conhece /releases/latest/download, que ignora prerelease — ZERO aluno receberia. use vX.Y.Z pra valer, ou -rcN (rc1..rc99) pra teste deliberado."
              exit 1 ;;
          esac
          MAN=$(python3 -c "import json;print(json.load(open('manifest.json'))['biblioteca_version'])")
          PLG=$(python3 -c "import json;print(json.load(open('manifest.json'))['plugins'][0]['version'])")
          RBZ=$(unzip -p payload/cura-ferramentas.rbz cura_ferramentas.rb \
                | sed -n "s/.*VERSION *= *'\([^']*\)'.*/\1/p" | head -1)
          UI=$(unzip -p payload/cura-ferramentas.rbz cura_ferramentas/core/shell.html \
                | sed -n "s/.*CURA_UI_VERSION *= *'\([^']*\)'.*/\1/p" | head -1)
          echo "tag=$GITHUB_REF_NAME base=$BASE biblioteca_version=$MAN plugin=$PLG rbz=$RBZ ui=$UI"
          [ -n "$RBZ" ] || { echo "::error::nao extrai VERSION de cura_ferramentas.rb dentro do rbz"; exit 1; }
          [ -n "$UI" ] || { echo "::error::nao extrai CURA_UI_VERSION de core/shell.html dentro do rbz"; exit 1; }
          [ "$BASE" = "$MAN" ] || { echo "::error::tag $BASE != biblioteca_version $MAN do manifest — o parque inteiro faria no-op (no-op do snapshot no install.sh / Test-CuraUpToDate no install.ps1) e ninguem receberia esta release"; exit 1; }
          [ "$PLG" = "$RBZ" ] || { echo "::error::manifest plugins[0].version $PLG != VERSION $RBZ dentro do rbz — banner de update permanente no plugin (core/updater.rb)"; exit 1; }
          [ "$UI" = "$RBZ" ] || { echo "::error::CURA_UI_VERSION $UI != VERSION $RBZ — rbz nao saiu do build.sh"; exit 1; }
          # 4o numero que ninguem ve divergir: o CuraUpscaler.jsx sai em DOIS
          # lugares — solto (link de resgate manual da pagina do curso,
          # /releases/latest/download/CuraUpscaler.jsx) e dentro do
          # payload/photoshop.zip (o que os instaladores gravam na pasta
          # compartilhada). Regerar so um dos dois publica release verde com o
          # link de resgate STALE: o aluno que baixa pela pagina fica com um
          # script diferente do que a biblioteca instalou, e nada avisa.
          JSX_SOLTO=$(sha256sum payload/CuraUpscaler.jsx | awk '{print $1}')
          JSX_VAZIO=$(printf '' | sha256sum | awk '{print $1}')
          JSX_ZIP=$(unzip -p payload/photoshop.zip CuraUpscaler.jsx 2>/dev/null | sha256sum | awk '{print $1}') || JSX_ZIP="$JSX_VAZIO"
          echo "jsx_solto=$JSX_SOLTO jsx_no_zip=$JSX_ZIP"
          [ "$JSX_ZIP" != "$JSX_VAZIO" ] || { echo "::error::nao achei CuraUpscaler.jsx dentro de payload/photoshop.zip — o zip nao saiu do tools/make_photoshop.py"; exit 1; }
          [ "$JSX_SOLTO" = "$JSX_ZIP" ] || { echo "::error::payload/CuraUpscaler.jsx ($JSX_SOLTO) != CuraUpscaler.jsx dentro do payload/photoshop.zip ($JSX_ZIP) — o link de resgate da pagina do curso ficaria stale (aluno baixaria um script diferente do instalado). rode tools/make_photoshop.py e versione os dois."; exit 1; }

      - name: sobe manifest.json atualizado
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json
          if-no-files-found: error

  windows-installer:
    name: compila instalador windows
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instala inno setup
        run: choco install innosetup -y --no-progress

      - name: versao do instalador (tag sem "v")
        id: ver
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: compila installer.iss
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" windows\installer.iss

      - name: sobe BibliotecaCURA-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/Output/BibliotecaCURA-Setup.exe
          if-no-files-found: error

  release:
    name: publica release no github
    needs: [manifest, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: baixa manifest.json atualizado
        uses: actions/download-artifact@v4
        with:
          name: manifest
          path: .

      - name: baixa instalador windows
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: windows/Output

      - name: publica release
        uses: softprops/action-gh-release@v2
        with:
          # os 8 assets sao todos obrigatorios: faltar um publica release verde
          # e quebrada — sem fonts.zip todo instalador loga erro, grava a
          # biblioteca_version ANTIGA no snapshot e re-tenta todo dia; sem
          # install.sh a linha do Terminal do mac vira 404.
          # Os dois novos desta release:
          #   - payload/photoshop.zip: buscado por URL em runtime (bloco
          #     "photoshop" do manifest), igual ao fonts.zip. Falta dele = mesmo
          #     estrago do fonts.zip, so que no bloco bonus (o instalador avisa,
          #     segue com plugin/fontes e re-tenta todo dia).
          #   - payload/CuraUpscaler.jsx: NAO e buscado por instalador nenhum —
          #     e o link de resgate manual da pagina do curso, pro aluno que so
          #     quer o .jsx solto. Entra aqui pra existir uma URL estavel
          #     (/releases/latest/download/CuraUpscaler.jsx) por release.
          fail_on_unmatched_files: true
          # tags com sufixo (ex: v9.1.0-rc1, v9.1.0-beta) viram prerelease e
          # nunca /releases/latest/download - só release cheia (vX.Y.Z) vira
          # "latest" e é puxada pelo auto-update do parque inteiro.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            windows/Output/BibliotecaCURA-Setup.exe
            payload/cura-ferramentas.rbz
            payload/fonts.zip
            payload/photoshop.zip
            payload/CuraUpscaler.jsx
            manifest.json
            scripts/install.sh
            scripts/install.ps1
