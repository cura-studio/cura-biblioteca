name: templates

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/install.*'
      - 'tools/test_template_*'
      - 'tools/test_plugin_*'
      - 'tools/test_distribution_*'
      - 'tools/prepare_channels.py'
      - 'tools/test_prepare_channels.py'
      - 'tools/make_manifest.py'
      - 'manifest.json'
      - 'payload/CURA.skp'
      - '.github/workflows/templates.yml'
  pull_request:
    paths:
      - 'scripts/install.*'
      - 'tools/test_template_*'
      - 'tools/test_plugin_*'
      - 'tools/test_distribution_*'
      - 'tools/prepare_channels.py'
      - 'tools/test_prepare_channels.py'
      - 'tools/make_manifest.py'
      - 'manifest.json'
      - 'payload/CURA.skp'
      - '.github/workflows/templates.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: template no Windows PowerShell 5.1
        shell: powershell
        run: ./tools/test_template_windows.ps1
      - name: recuperação de plugins no Windows PowerShell 5.1
        shell: powershell
        run: ./tools/test_plugin_windows.ps1
      - name: posse dos canais no Windows PowerShell 5.1
        shell: powershell
        run: ./tools/test_distribution_windows.ps1
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: template no bash 3.2 (python e fallback awk)
        run: /bin/bash tools/test_template_mac.sh
      - name: staging e recuperação de plugins no bash 3.2
        run: /bin/bash tools/test_plugin_mac.sh
      - name: posse dos canais no bash 3.2
        run: /bin/bash tools/test_distribution_mac.sh
      - name: preparação privada dos canais no Python
        run: python3 tools/test_prepare_channels.py
      - name: integridade do manifest e payloads
        run: |
          python3 tools/make_manifest.py
          git diff --exit-code -- manifest.json
